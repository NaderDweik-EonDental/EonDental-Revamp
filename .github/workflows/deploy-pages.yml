name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}/
      PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io
      # Optional: add VITE_HF_TOKEN in repo Settings → Secrets for smile AI on Pages
      VITE_HF_TOKEN: ${{ secrets.VITE_HF_TOKEN }}
      VITE_HF_IMAGE_MODEL: ${{ vars.VITE_HF_IMAGE_MODEL }}
      VITE_HF_PROVIDER: ${{ vars.VITE_HF_PROVIDER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build static site
        run: node scripts/build-github-pages.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
